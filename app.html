<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Geo-Land · Dashboard</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
</head>
<body>
  <div id="app-nav"></div>
  <main class="app-main">
    <div id="storage-banner-host"></div>
    <div class="page-header">
      <div>
        <h1>
          <span data-i18n="dash_welcome">Қош келдіңіз</span>,
          <span id="welcome-name"></span>
        </h1>
        <p id="welcome-sub"></p>
      </div>
    </div>
    <div class="dash-grid" id="dash-grid"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/open-categories.js"></script>
  <script src="js/open-sets.js"></script>
  <script src="js/app-nav.js"></script>
  <script>
    /** Nursultan WhatsApp: 8 775 254 3364 → international +7 775 254 3364 */
    const WA_URL = "https://wa.me/77752543364";
    const DRIVE_URL =
      "https://drive.google.com/drive/folders/1-IoSUhaR_DLbgW07L9Y9GKOEy2zvo_OU?usp=sharing";

    function materialsCardHtml() {
      return `
          <a class="dash-card" href="${DRIVE_URL}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">
            <span class="icon">📂</span>
            <h3 data-i18n="card_materials">Презентациялар</h3>
            <p data-i18n="card_materials_d">Тақырып бойынша Google Drive материалдары.</p>
            <span class="btn btn-primary btn-sm" data-i18n="materials_open">Презентацияларды ашу</span>
          </a>`;
    }

    function whatsappCardHtml() {
      return `
          <div class="dash-card dash-card-wa">
            <span class="icon">💬</span>
            <h3 data-i18n="card_wa">WhatsApp</h3>
            <p data-i18n="card_wa_d">Нұрсұлтан Утебаевқа жазу — QR сканерлеңіз немесе басыңыз.</p>
            <a class="wa-qr-link" href="${WA_URL}" target="_blank" rel="noopener noreferrer" title="WhatsApp">
              <img class="wa-qr" src="assets/whatsapp-qr.png" width="160" height="160" alt="WhatsApp QR" />
            </a>
            <a class="btn btn-primary btn-sm" href="${WA_URL}" target="_blank" rel="noopener noreferrer" data-i18n="card_wa_open">WhatsApp ашу</a>
            <p class="meta wa-phone">+7 775 254 3364</p>
          </div>`;
    }

    async function bootDash() {
      const user = Auth.require();
      if (!user) return;
      mountAppNav("dash");
      document.getElementById("welcome-name").textContent = Auth.displayName(user);
      document.getElementById("welcome-sub").textContent =
        user.role === "teacher" ? Lang.t("dash_teacher_sub") : Lang.t("dash_student_sub");
      document.getElementById("welcome-sub").setAttribute(
        "data-i18n",
        user.role === "teacher" ? "dash_teacher_sub" : "dash_student_sub"
      );

      const grid = document.getElementById("dash-grid");
      const openHubCard = `
          <a class="dash-card" href="open-hub.html" style="color:inherit;text-decoration:none">
            <span class="icon">✍️</span>
            <h3 data-i18n="card_open">Ашық сұрақтар</h3>
            <p data-i18n="open_hub_card_d">Алдымен тақырыпты таңдаңыз, содан кейін жинаққа жауап беріңіз.</p>
            <span class="btn btn-primary btn-sm" data-i18n="start">Бастау</span>
          </a>`;

      if (user.role === "teacher") {
        grid.innerHTML = `
          <a class="dash-card" href="teacher.html" style="color:inherit;text-decoration:none">
            <span class="icon">📋</span>
            <h3 data-i18n="card_teacher">Оқушы нәтижелері</h3>
            <p data-i18n="card_teacher_d">Барлық жіберілген тест пен есептер.</p>
            <span class="btn btn-primary btn-sm" data-i18n="view">Қарау</span>
          </a>
          <a class="dash-card" href="teacher-open.html" style="color:inherit;text-decoration:none">
            <span class="icon">➕</span>
            <h3 data-i18n="open_manage_title">Ашық сұрақтар жасау</h3>
            <p data-i18n="open_manage_lead">Тақырып, сұрақтар, URL сурет, жариялау.</p>
            <span class="btn btn-primary btn-sm" data-i18n="open_create_new">Жаңа жинақ</span>
          </a>
          <div class="dash-card">
            <span class="icon">📝</span>
            <h3 data-i18n="card_tests">Тесттер</h3>
            <p data-i18n="card_tests_d">Көп таңдаулы сұрақтар.</p>
            <p class="meta">1 · <span data-i18n="available">Қолжетімді</span></p>
            <a class="btn btn-primary btn-sm" href="test.html?id=test-1" data-i18n="start">Бастау</a>
          </div>
          <div class="dash-card">
            <span class="icon">🧮</span>
            <h3 data-i18n="card_calcs">Есептер</h3>
            <p data-i18n="card_calcs_d">Тақырыптық есептеулер.</p>
            <p class="meta">1 · <span data-i18n="available">Қолжетімді</span></p>
            <a class="btn btn-primary btn-sm" href="calc.html?id=calc-1" data-i18n="start">Бастау</a>
          </div>
          ${openHubCard}
          ${materialsCardHtml()}
          ${whatsappCardHtml()}
        `;
      } else {
        grid.innerHTML = `
          <div class="dash-card">
            <span class="icon">📝</span>
            <h3 data-i18n="card_tests">Тесттер</h3>
            <p data-i18n="card_tests_d">Көп таңдаулы сұрақтар. Автоматты бағалау.</p>
            <p class="meta">Тест №1 · 30 <span data-i18n="points_short">б</span></p>
            <a class="btn btn-primary btn-sm" href="test.html?id=test-1" data-i18n="start">Бастау</a>
          </div>
          <div class="dash-card">
            <span class="icon">🧮</span>
            <h3 data-i18n="card_calcs">Есептер</h3>
            <p data-i18n="card_calcs_d">Тақырыптық есептеулер. Жауапты жазып жіберіңіз.</p>
            <p class="meta">Есептер №1 · 10 <span data-i18n="points_short">б</span></p>
            <a class="btn btn-primary btn-sm" href="calc.html?id=calc-1" data-i18n="start">Бастау</a>
          </div>
          ${openHubCard}
          <a class="dash-card" href="history.html" style="color:inherit;text-decoration:none">
            <span class="icon">📊</span>
            <h3 data-i18n="card_history">Менің нәтижелерім</h3>
            <p data-i18n="card_history_d">Өткен талпыныстар мен ұпайлар.</p>
            <span class="btn btn-primary btn-sm" data-i18n="view">Қарау</span>
          </a>
          ${materialsCardHtml()}
          ${whatsappCardHtml()}
        `;
      }
      Lang.apply();
      ensureStorageBanner(document.getElementById("storage-banner-host"));

      window.addEventListener("langchange", () => {
        document.getElementById("welcome-name").textContent = Auth.displayName(user);
      });
    }
    bootDash();
  </script>
</body>
</html>
